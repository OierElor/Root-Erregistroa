    <g stroke="#16130f" stroke-width="9">
      <circle cx="152" cy="142" r="47" fill="#d9a441"/>
      <circle cx="360" cy="142" r="47" fill="#6fae5c"/>
      <circle cx="256" cy="268" r="54" fill="#c9553f"/>
